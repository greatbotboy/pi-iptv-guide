# Runs on the Pi. GitHub-hosted runners cannot reach 10.20.20.119.
# Push to main only: this repo is public, and a pull_request job would
# execute fork code on the Pi.

name: Deploy to Pi

on:
  push:
    branches: [main]

concurrency:
  group: deploy-pi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Sync into /home/pi/iptv-guide and restart
        run: bash deploy/apply-on-pi.sh
